<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
          <div class="page-heading">
                    <p class="eyebrow">ĐIỀU CHUYỂN</p>
                    <h1 th:text="${editMode ? 'Chỉnh sửa chuyển tiền' : 'Tạo chuyển tiền'}">Tạo chuyển tiền</h1>
                    <p class="text-secondary mb-0">Chuyển tiền chỉ được lưu thành lịch sử, chưa làm thay đổi số dư.</p>
          </div>

          <section class="form-panel form-panel-narrow">
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                              <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>
                    <form th:action="${editMode ? '/transfers/' + transferId + '/edit' : '/transfers'}"
                              th:object="${transferRequest}" method="post">
                              <div class="mb-3">
                                        <label class="form-label" for="fromSourceId">Nguồn tiền chuyển đi</label>
                                        <select class="form-select" id="fromSourceId" th:field="*{fromSourceId}"
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn nguồn chuyển đi</option>
                                                  <option th:each="source : ${moneySources}" th:value="${source.id}"
                                                            th:text="${source.name}">Tiền mặt</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{fromSourceId}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="toSourceId">Nguồn tiền nhận</label>
                                        <select class="form-select" id="toSourceId" th:field="*{toSourceId}"
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn nguồn nhận</option>
                                                  <option th:each="source : ${moneySources}" th:value="${source.id}"
                                                            th:text="${source.name}">Ngân hàng</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{toSourceId}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="amount">Số tiền</label>
                                        <input class="form-control" id="amount" th:field="*{amount}" type="number"
                                                  min="0.01" step="0.01" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{amount}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="transferDate">Ngày chuyển tiền</label>
                                        <input class="form-control" id="transferDate" th:field="*{transferDate}"
                                                  type="date" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{transferDate}"></div>
                              </div>
                              <div class="mb-4">
                                        <label class="form-label" for="description">Mô tả</label>
                                        <textarea class="form-control" id="description" th:field="*{description}"
                                                  rows="3" placeholder="Nội dung chuyển tiền"
                                                  th:errorclass="is-invalid"></textarea>
                                        <div class="invalid-feedback" th:errors="*{description}"></div>
                              </div>
                              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                              <div class="form-actions">
                                        <a class="btn btn-secondary" th:href="@{/transfers}">Hủy</a>
                                        <button class="btn btn-primary" type="submit"
                                                  th:text="${editMode ? 'Lưu thay đổi' : 'Tạo chuyển tiền'}">Lưu</button>
                              </div>
                    </form>
          </section>
</section>

</html>
