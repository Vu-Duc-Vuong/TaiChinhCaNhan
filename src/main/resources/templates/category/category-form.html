<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
          <div class="page-heading">
                    <p class="eyebrow">DANH MỤC</p>
                    <h1 th:text="${editMode ? 'Chỉnh sửa danh mục' : 'Thêm danh mục'}">Thêm danh mục</h1>
                    <p class="text-secondary mb-0">Mỗi người dùng không thể có hai danh mục cùng tên trong cùng loại.
                    </p>
          </div>

          <section class="form-panel form-panel-narrow">
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                              <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>
                    <form th:action="${editMode ? '/categories/' + categoryId + '/edit' : '/categories'}"
                              th:object="${categoryRequest}" method="post">
                              <div class="mb-3">
                                        <label class="form-label" for="name">Tên danh mục</label>
                                        <input class="form-control" id="name" th:field="*{name}" type="text"
                                                  placeholder="Ví dụ: Lương tháng" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{name}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="type">Loại danh mục</label>
                                        <select class="form-select" id="type" th:field="*{type}"
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn loại danh mục</option>
                                                  <option th:each="categoryType : ${categoryTypes}"
                                                            th:value="${categoryType}" th:text="${categoryType}">INCOME
                                                  </option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{type}"></div>
                              </div>
                              <div class="mb-4">
                                        <label class="form-label" for="description">Mô tả</label>
                                        <textarea class="form-control" id="description" th:field="*{description}"
                                                  rows="3" placeholder="Thông tin bổ sung nếu có"
                                                  th:errorclass="is-invalid"></textarea>
                                        <div class="invalid-feedback" th:errors="*{description}"></div>
                              </div>
                              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                              <div class="form-actions">
                                        <a class="btn btn-secondary" th:href="@{/categories}">Hủy</a>
                                        <button class="btn btn-primary" type="submit"
                                                  th:text="${editMode ? 'Lưu thay đổi' : 'Thêm danh mục'}">Lưu</button>
                              </div>
                    </form>
          </section>
</section>

</html>
