<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
          <div class="page-heading page-heading-row">
                    <div>
                              <p class="eyebrow">PHÂN LOẠI</p>
                              <h1>Danh mục</h1>
                              <p class="text-secondary mb-0">Phân loại thu nhập và chi tiêu của bạn.</p>
                    </div>
                    <a class="btn btn-primary" th:href="@{/categories/new}">Thêm danh mục</a>
          </div>

          <section class="filter-panel">
                    <form class="row g-3 align-items-end" th:action="@{/categories}" method="get">
                              <div class="col-md-6">
                                        <label class="form-label" for="keyword">Tìm theo tên</label>
                                        <input class="form-control" id="keyword" name="keyword" type="search"
                                                  th:value="${keyword}" placeholder="Ví dụ: Lương">
                              </div>
                              <div class="col-md-4">
                                        <label class="form-label" for="type">Loại danh mục</label>
                                        <select class="form-select" id="type" name="type">
                                                  <option value="">Tất cả loại</option>
                                                  <option th:each="categoryType : ${categoryTypes}"
                                                            th:value="${categoryType}"
                                                            th:selected="${selectedType == categoryType}"
                                                            th:text="${categoryType}">INCOME</option>
                                        </select>
                              </div>
                              <div class="col-md-2 d-grid">
                                        <button class="btn btn-outline-primary" type="submit">Lọc</button>
                              </div>
                    </form>
          </section>

          <section class="data-panel">
                    <div class="empty-state" th:if="${#lists.isEmpty(categories)}">
                              <div class="empty-state-icon">☷</div>
                              <h2>Chưa có danh mục</h2>
                              <p class="text-secondary">Hãy thêm danh mục đầu tiên để phân loại dữ liệu.</p>
                              <a class="btn btn-primary" th:href="@{/categories/new}">Thêm danh mục</a>
                    </div>

                    <div class="table-responsive" th:unless="${#lists.isEmpty(categories)}">
                              <table class="table source-table align-middle mb-0">
                                        <thead>
                                                  <tr>
                                                            <th>Tên danh mục</th>
                                                            <th>Loại</th>
                                                            <th>Mô tả</th>
                                                            <th>Ngày tạo</th>
                                                            <th class="text-end">Thao tác</th>
                                                  </tr>
                                        </thead>
                                        <tbody>
                                                  <tr th:each="category : ${categories}">
                                                            <td>
                                                                      <a class="source-name"
                                                                                th:href="@{/categories/{id}(id=${category.id})}"
                                                                                th:text="${category.name}">Lương</a>
                                                            </td>
                                                            <td>
                                                                      <span class="source-type-badge"
                                                                                th:classappend="' category-' + ${category.type.name().toLowerCase()}"
                                                                                th:text="${category.type}">INCOME</span>
                                                            </td>
                                                            <td class="description-cell"
                                                                      th:text="${category.description ?: '-'}">-</td>
                                                            <td
                                                                      th:text="${#temporals.format(category.createdAt, 'dd/MM/yyyy')}">
                                                                      -</td>
                                                            <td>
                                                                      <div class="table-actions justify-content-end">
                                                                                <a class="btn btn-sm btn-outline-secondary"
                                                                                          th:href="@{/categories/{id}(id=${category.id})}">Xem</a>
                                                                                <a class="btn btn-sm btn-outline-primary"
                                                                                          th:href="@{/categories/{id}/edit(id=${category.id})}">Sửa</a>
                                                                                <form th:action="@{/categories/{id}/delete(id=${category.id})}"
                                                                                          method="post"
                                                                                          onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này không?');">
                                                                                          <input type="hidden"
                                                                                                    th:name="${_csrf.parameterName}"
                                                                                                    th:value="${_csrf.token}">
                                                                                          <button class="btn btn-sm btn-outline-danger"
                                                                                                    type="submit">Xóa</button>
                                                                                </form>
                                                                      </div>
                                                            </td>
                                                  </tr>
                                        </tbody>
                              </table>
                    </div>
          </section>
</section>

</html>
