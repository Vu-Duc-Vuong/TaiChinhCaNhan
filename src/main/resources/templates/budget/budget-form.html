<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
          <div class="page-heading">
                    <p class="eyebrow">KẾ HOẠCH CHI TIÊU</p>
                    <h1 th:text="${editMode ? 'Chỉnh sửa ngân sách' : 'Thêm ngân sách'}">Thêm ngân sách</h1>
                    <p class="text-secondary mb-0">Mỗi ngân sách cần gắn với một danh mục chi tiêu.</p>
          </div>

          <section class="form-panel form-panel-narrow">
                    <form th:action="${editMode ? '/budgets/' + budgetId + '/edit' : '/budgets'}"
                              th:object="${budgetRequest}" method="post">
                              <div class="alert alert-danger" th:if="${#fields != null and #fields.hasGlobalErrors()}">
                                        <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                                        </p>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="name">Tên ngân sách</label>
                                        <input class="form-control" id="name" th:field="*{name}" type="text"
                                                  placeholder="Ví dụ: Chi tiêu tháng 11" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{name}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="amount">Hạn mức ngân sách</label>
                                        <input class="form-control" id="amount" th:field="*{amount}" type="number"
                                                  min="0.01" step="0.01" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{amount}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="categoryId">Danh mục chi tiêu</label>
                                        <select class="form-select" id="categoryId" th:field="*{categoryId}" required
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn danh mục chi tiêu</option>
                                                  <option th:each="category : ${categories}" th:value="${category.id}"
                                                            th:text="${category.name}">Ăn uống</option>
                                        </select>
                                        <div class="form-text">Chỉ có thể chọn danh mục loại EXPENSE.</div>
                                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                              </div>
                              <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                                  <label class="form-label" for="startDate">Ngày bắt đầu</label>
                                                  <input class="form-control" id="startDate" th:field="*{startDate}"
                                                            type="date" th:errorclass="is-invalid">
                                                  <div class="invalid-feedback" th:errors="*{startDate}"></div>
                                        </div>
                                        <div class="col-md-6">
                                                  <label class="form-label" for="endDate">Ngày kết thúc</label>
                                                  <input class="form-control" id="endDate" th:field="*{endDate}"
                                                            type="date" th:errorclass="is-invalid">
                                                  <div class="invalid-feedback" th:errors="*{endDate}"></div>
                                        </div>
                              </div>
                              <div class="mb-4">
                                        <label class="form-label" for="description">Mô tả</label>
                                        <textarea class="form-control" id="description" th:field="*{description}"
                                                  rows="3" placeholder="Thông tin bổ sung nếu có"
                                                  th:errorclass="is-invalid"></textarea>
                                        <div class="invalid-feedback" th:errors="*{description}"></div>
                              </div>
                              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                              <div class="form-actions">
                                        <a class="btn btn-secondary" th:href="@{/budgets}">Hủy</a>
                                        <button class="btn btn-primary" type="submit"
                                                  th:text="${editMode ? 'Lưu thay đổi' : 'Thêm ngân sách'}">Lưu</button>
                              </div>
                    </form>
          </section>
</section>

</html>
