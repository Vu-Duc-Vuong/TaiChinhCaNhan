<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
          <div class="page-heading">
                    <p class="eyebrow">BẢO MẬT</p>
                    <h1>Đổi mật khẩu</h1>
                    <p class="text-secondary mb-0">Sau khi đổi mật khẩu, bạn sẽ cần đăng nhập lại.</p>
          </div>

          <section class="form-panel form-panel-narrow">
                    <div class="form-panel-heading">
                              <h2>Cập nhật mật khẩu</h2>
                    </div>

                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                              <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>

                    <form th:action="@{/change-password}" th:object="${changePasswordRequest}" method="post">
                              <div class="mb-3">
                                        <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                                        <div class="password-field">
                                                  <input class="form-control" id="currentPassword"
                                                            th:field="*{currentPassword}" type="password"
                                                            autocomplete="current-password" th:errorclass="is-invalid">
                                                  <button class="password-toggle" type="button"
                                                            data-target="currentPassword">Hiện</button>
                                        </div>
                                        <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="newPassword">Mật khẩu mới</label>
                                        <div class="password-field">
                                                  <input class="form-control" id="newPassword" th:field="*{newPassword}"
                                                            type="password" autocomplete="new-password"
                                                            th:errorclass="is-invalid">
                                                  <button class="password-toggle" type="button"
                                                            data-target="newPassword">Hiện</button>
                                        </div>
                                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                              </div>
                              <div class="mb-4">
                                        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                                        <div class="password-field">
                                                  <input class="form-control" id="confirmPassword"
                                                            th:field="*{confirmPassword}" type="password"
                                                            autocomplete="new-password" th:errorclass="is-invalid">
                                                  <button class="password-toggle" type="button"
                                                            data-target="confirmPassword">Hiện</button>
                                        </div>
                                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                              </div>
                              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                              <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
                    </form>
          </section>
</section>

</html>
