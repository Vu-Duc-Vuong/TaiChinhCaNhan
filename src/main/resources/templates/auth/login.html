<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="auth-page">
          <main class="auth-shell">
                    <a class="auth-brand" th:href="@{/login}">Tài chính cá nhân</a>

                    <section class="auth-card">
                              <div class="auth-heading">
                                        <p class="eyebrow text-primary">CHÀO MỪNG TRỞ LẠI</p>
                                        <h1>Đăng nhập</h1>
                                        <p class="text-secondary mb-0">Đăng nhập để quản lý tài chính của bạn.</p>
                              </div>

                              <div class="alert alert-danger" th:if="${loginError}">
                                        Tên đăng nhập hoặc mật khẩu không chính xác.
                              </div>
                              <div class="alert alert-success" th:if="${registered}">
                                        Đăng ký thành công. Bạn có thể đăng nhập ngay bây giờ.
                              </div>
                              <div class="alert alert-success" th:if="${passwordChanged}">
                                        Mật khẩu đã được đổi. Vui lòng đăng nhập lại.
                              </div>
                              <div class="alert alert-secondary" th:if="${loggedOut}">
                                        Bạn đã đăng xuất.
                              </div>

                              <form th:action="@{/login}" method="post" class="auth-form">
                                        <div class="mb-3">
                                                  <label class="form-label" for="login">Username hoặc email</label>
                                                  <input class="form-control" id="login" name="login" type="text"
                                                            autocomplete="username" required>
                                        </div>
                                        <div class="mb-3">
                                                  <label class="form-label" for="password">Mật khẩu</label>
                                                  <div class="password-field">
                                                            <input class="form-control" id="password" name="password"
                                                                      type="password" autocomplete="current-password"
                                                                      required>
                                                            <button class="password-toggle" type="button"
                                                                      data-target="password">Hiện</button>
                                                  </div>
                                        </div>
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                              </form>

                              <p class="auth-switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
                    </section>
          </main>
          <script th:src="@{/js/auth.js}"></script>
</body>

</html>
