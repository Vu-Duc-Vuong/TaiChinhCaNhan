<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="auth-page">
          <main class="auth-shell">
                    <a class="auth-brand" th:href="@{/login}">Tài chính cá nhân</a>

                    <section class="auth-card">
                              <div class="auth-heading">
                                        <p class="eyebrow text-primary">QUÊN MẬT KHẨU</p>
                                        <h1>Khôi phục mật khẩu</h1>
                                        <p class="text-secondary mb-0">Nhập email của bạn để nhận hướng dẫn đặt lại mật
                                                  khẩu.</p>
                              </div>

                              <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post"
                                        class="auth-form">
                                        <div class="mb-3">
                                                  <label class="form-label" for="email">Email</label>
                                                  <input class="form-control" id="email" th:field="*{email}"
                                                            type="email" autocomplete="email"
                                                            th:errorclass="is-invalid">
                                                  <div class="invalid-feedback" th:errors="*{email}"></div>
                                        </div>

                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-primary w-100" type="submit">Gửi yêu cầu</button>
                              </form>

                              <p class="auth-switch"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
                    </section>
          </main>
          <script th:src="@{/js/auth.js}"></script>
</body>

</html>
