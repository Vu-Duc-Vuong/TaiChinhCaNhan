<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
          <div class="page-heading">
                    <p class="eyebrow">THU CHI</p>
                    <h1 th:text="${editMode ? 'Chỉnh sửa giao dịch' : 'Thêm giao dịch'}">Thêm giao dịch</h1>
                    <p class="text-secondary mb-0">Giao dịch hiện chưa làm thay đổi số dư nguồn tiền.</p>
          </div>

          <section class="form-panel form-panel-narrow">
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                              <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>
                    <form th:action="${editMode ? '/transactions/' + transactionId + '/edit' : '/transactions'}"
                              th:object="${transactionRequest}" method="post">
                              <div class="mb-3">
                                        <label class="form-label" for="type">Loại giao dịch</label>
                                        <select class="form-select" id="type" th:field="*{type}"
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn loại giao dịch</option>
                                                  <option th:each="transactionType : ${transactionTypes}"
                                                            th:value="${transactionType}" th:text="${transactionType}">
                                                            INCOME</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{type}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="amount">Số tiền</label>
                                        <input class="form-control" id="amount" th:field="*{amount}" type="number"
                                                  min="0.01" step="0.01" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{amount}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="categoryId">Danh mục</label>
                                        <select class="form-select" id="categoryId" th:field="*{categoryId}"
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn danh mục</option>
                                                  <option th:each="category : ${categories}" th:value="${category.id}"
                                                            th:text="${category.name + ' (' + category.type + ')'}">
                                                            Lương (INCOME)</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="moneySourceId">Nguồn tiền</label>
                                        <select class="form-select" id="moneySourceId" th:field="*{moneySourceId}"
                                                  th:errorclass="is-invalid">
                                                  <option value="">Chọn nguồn tiền</option>
                                                  <option th:each="source : ${moneySources}" th:value="${source.id}"
                                                            th:text="${source.name}">Tiền mặt</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{moneySourceId}"></div>
                              </div>
                              <div class="mb-3">
                                        <label class="form-label" for="transactionDate">Ngày giao dịch</label>
                                        <input class="form-control" id="transactionDate" th:field="*{transactionDate}"
                                                  type="date" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:errors="*{transactionDate}"></div>
                              </div>
                              <div class="mb-4">
                                        <label class="form-label" for="description">Mô tả</label>
                                        <textarea class="form-control" id="description" th:field="*{description}"
                                                  rows="3" placeholder="Nội dung giao dịch"
                                                  th:errorclass="is-invalid"></textarea>
                                        <div class="invalid-feedback" th:errors="*{description}"></div>
                              </div>
                              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                              <div class="form-actions">
                                        <a class="btn btn-secondary" th:href="@{/transactions}">Hủy</a>
                                        <button class="btn btn-primary" type="submit"
                                                  th:text="${editMode ? 'Lưu thay đổi' : 'Thêm giao dịch'}">Lưu</button>
                              </div>
                    </form>
          </section>
</section>

</html>
